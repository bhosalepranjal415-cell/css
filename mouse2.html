<!DOCTYPE html>
<html ng-app="app">
<head>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<style>
.box{
  width:150px;height:100px;
  background:rgb(139, 139, 212);color:white;
  line-height:100px;text-align:center;
  position:absolute;cursor:move;
}
.after{ background:rgb(108, 11, 138); }
</style>
</head>

<body ng-controller="ctrl">

<div class="box" ng-class="{'after':done}"
     ng-mousedown="drag($event)">Drag</div>

<script>
angular.module("app",[]).controller("ctrl",function($scope,$document){
  let x=50,y=50,box=document.querySelector(".box");
  box.style.left=x+"px"; box.style.top=y+"px";

  $scope.drag=function(e){
    let sx=e.clientX-x, sy=e.clientY-y;
    $document.on("mousemove",m);
    $document.on("mouseup",u);

    function m(e){ x=e.clientX-sx; y=e.clientY-sy;
      box.style.left=x+"px"; box.style.top=y+"px"; }

    function u(){ $scope.$apply(()=> $scope.done=true);
      $document.off("mousemove",m); $document.off("mouseup",u); }
  }
});
</script>

</body>
</html>
